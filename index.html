<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Foam CAD</title>
    <link href="./bonsai-v1.2.2-dist/bonsai.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />    
    <link href="./style.css" rel="stylesheet">
  </head>
  <body>
    <div class="x-line" style="display: none;"  ></div>
    <div class="y-line" style="display: none;" ></div>
    <div class="x-coordinates" style="display: none;" ></div>
    <div class="y-coordinates" style="display: none;" ></div>
    <div id="sidebar">
      <div id="header">
        <button id="back-button" class="grey" disabled data-icon="arrow_back">Back</button>
        <div class="separator"></div>
        <div class="group">
          <button id="undo-button" class="grey" data-icon="undo">Undo</button>
          <button id="redo-button" class="grey" data-icon="redo">Redo</button>
        </div>
      </div>
      <div id="panel-container">
        <div class="panel" id="main-panel">
          <div class="group">
            <button class="column grow white" id="shapes-button"  data-icon="interests">Shapes</button>
            <button class="column grow white" id="foam-button"  data-icon="rectangle">Foam</button>
            <button class="column grow white" id="case-button"  data-icon="home_repair_service">Case</button>
            <button class="column grow blue" id="checkout-button" disabled data-icon="shopping_cart">Checkout</button>
            <!-- <button class="column grow blue" id="save-button" data-icon="cloud_upload">Save</button> -->
          </div>
          <div class="group" style="position: relative; display: inline-block;">
            <button class="grow white" id="export-dropdown-button" data-icon="description">
              Export as Document
            </button>
          
            <div id="export-dropdown" style="display: none; z-index: 1000;">
              <button class="column grow white" data-icon="precision_manufacturing" id="dfx-button">
                Export CNC-compatible file
              </button>
              <button class="column grow white" data-icon="picture_as_pdf" id="pdf-button">
                Export PDF technical drawing
              </button>
              <button class="column grow white" data-icon="image" id="export-image">
                Export rendered image of the shape
              </button>
            </div>
          </div>
          
          
        </div><!--panel-->
        <div class="panel" id="shapes-panel">
          <div class="group">
            <button class="column grow white" id="create-rectangle" data-icon="rectangle">Rectangle</button>
            <button class="column grow white" id="create-circle" data-icon="circle">Circle</button>
            <button class="column grow white" id="create-polygon" data-icon="polyline">Freehand</button>
            <button class="column grow white" id="create-photoshape" data-icon="photo_camera">Photoshape</button>
          </div>
          <div class="group">
            <button class="grow white" id="my-shapes-button" data-icon="play_shapes">My Shapes</button>
          </div>
          <div id="my-shapes-container">
          </div>
        </div><!--panel-->
        <div class="panel" id="foam-panel">
          <div class="group">
            <button class="column grow white" id="edit-outline" disabled data-icon="polyline">Edit Outline</button>
            <button class="column grow white" id="corner-radiuses" disabled data-icon="rounded_corner">Corner Radiuses</button>
            <button class="column grow white" id="push-edges" disabled data-icon="compress">Push Edges</button>
          </div>
        </div><!--panel-->
        <div class="panel" id="case-panel">
          <div class="group">
            <button class="column grow white" id="upload-model" disabled data-icon="cloud_upload">Upload OBJ Model</button>
            <button class="column grow white" id="position" disabled data-icon="open_with">Move</button>
          </div>			
        </div><!--panel-->
        <div class="panel" id="circle-panel">
          <div class="group">
            <button class="column grow white" id="radius-button"  data-icon="width">Radius</button>
            <button class="column grow white" id="depth-button"  data-icon="height">Depth</button>
            <button class="column grow white" id="copy-button" disabled data-icon="copy_all">Copy</button>
            <button class="column grow white" id="delete-button"  data-icon="delete">Delete</button>
          </div>
        </div><!--panel-->
        <div class="panel" id="rectangle-panel">
          <div class="group">
            <button class="column grow white" id="rectangle-resize-button"  data-icon="aspect_ratio">Resize</button>
            <button class="column grow white" id="rectangle-depth-button"  data-icon="height">Depth</button>
            <button class="column grow white" id="rectangle-rotate-button"  data-icon="rotate_right">Rotate</button>
            <button class="column grow white" id="rectangle-copy-button" disabled data-icon="copy_all">Copy</button>
            <button class="column grow white" id="rectangle-delete-button"  data-icon="delete">Delete</button>
          </div>
        </div><!--panel-->      
        <div class="panel" id="photoshape-panel">
          <div class="group">
            <button class="column grow white" id="photoshape-depth-button"  data-icon="height">Depth</button>
            <button class="column grow white" id="photoshape-rotate-button"  data-icon="rotate_right">Rotate</button>
            <button class="column grow white" id="photoshape-copy-button" disabled data-icon="copy_all">Copy</button>
            <button class="column grow white" id="photoshape-delete-button"  data-icon="delete">Delete</button>
          </div>
        </div><!--panel-->   
        <div class="panel" id="polygon-panel">
          <div class="group">
            <button class="column grow white" id="polygon-depth-button"  data-icon="height">Depth</button>
            <button class="column grow white" id="polygon-rotate-button"  data-icon="rotate_right">Rotate</button>
            <button class="column grow white" id="polygon-copy-button" disabled data-icon="copy_all">Copy</button>
            <button class="column grow white" id="polygon-delete-button"  data-icon="delete">Delete</button>
          </div>
          <div class="group">
            <button class="column grow white" id="edit-shape" data-icon="play_shapes">Edit shapes</button>
          </div>
          <!-- <div class="group">
            <label for="pointsCount" style="color: white; padding-right: 5px;">Points:</label>
            <input 
              type="range"

              max="5"

          </div> -->
          <div class="group">
            <div id="navButtons" class="column grow white" style="display: flex; gap: 10px; margin-top: 10px;">
              <button id="prevBtn">Previous</button>
              <button id="nextBtn">Next</button>
            </div>            
          </div>
        </div>      
        <div class="panel" id="radius-panel">
            <div class="group">
                <input id="radius-slider" class="column grow" type="range" min="5" max="350" value="100">
                <input id="radius-input" class="column" style="width:auto;" type="number" min="5" max="350" value="100">
            </div>
        </div><!--panel-->    
        <div class="panel" id="depth-panel">
            <div class="group">
                <input id="depth-slider" class="column grow" type="range" min="5" max="370" value="250">
                <input id="depth-input" class="column" style="width:auto;" type="number" min="5" max="370" value="250">
            </div>
        </div><!--panel-->            
        <div class="panel" id="rectangle-resize-panel">
            <div class="group">
                <input id="rectangle-width-slider" class="column grow" type="range" min="5" max="350" value="100">
                <input id="rectangle-width-input" class="column" style="width:auto;" type="number" min="5" max="350" value="100">
            </div>
            <div class="group">
                <input id="rectangle-height-slider" class="column grow" type="range" min="5" max="350" value="100">
                <input id="rectangle-height-input" class="column" style="width:auto;" type="number" min="5" max="350" value="100">
            </div>            
        </div><!--panel-->    
        <div class="panel" id="rectangle-depth-panel">
            <div class="group">
                <input id="rectangle-depth-slider" class="column grow" type="range" min="5" max="370" value="250">
                <input id="rectangle-depth-input" class="column" style="width:auto;" type="number" min="5" max="370" value="250">
            </div>
        </div><!--panel-->    
        <div class="panel" id="rectangle-rotate-panel">
            <div class="group">
                <input id="rectangle-rotate-slider" class="column grow" type="range" min="0" max="360" value="0">
                <input id="rectangle-rotate-input" class="column" style="width:auto;" type="number" min="0" max="360" value="0">
            </div>
        </div><!--panel-->        
        <div class="panel" id="photoshape-depth-panel">
            <div class="group">
                <input id="photoshape-depth-slider" class="column grow" type="range" min="5" max="370" value="250">
                <input id="photoshape-depth-input" class="column" style="width:auto;" type="number" min="5" max="370" value="250">
            </div>
        </div><!--panel-->    
        <div class="panel" id="photoshape-rotate-panel">
            <div class="group">
                <input id="photoshape-rotate-slider" class="column grow" type="range" min="0" max="360" value="0">
                <input id="photoshape-rotate-input" class="column" style="width:auto;" type="number" min="0" max="360" value="0">
            </div>
        </div><!--panel-->                
        <div class="panel" id="polygon-depth-panel">
          <div class="group">
              <input id="polygon-depth-slider" class="column grow" type="range" min="5" max="370" value="250">
              <input id="polygon-depth-input" class="column" style="width:auto;" type="number" min="5" max="370" value="250">
          </div>
      </div><!--panel-->    
      <div class="panel" id="polygon-rotate-panel">
          <div class="group">
              <input id="polygon-rotate-slider" class="column grow" type="range" min="0" max="360" value="0">
              <input id="polygon-rotate-input" class="column" style="width:auto;" type="number" min="0" max="360" value="0">
          </div>
      </div><!--panel-->                
        <div class="panel" id="upload-photo-panel">
            <input id="upload-photo-input" type="file">
            <img id="upload-photo-img"></img>
        </div>

    </div>

      <button class="button" id="buttonContainer"  style="display: none;" >Done</button>
      <button class="button" id="saveButtonContainer" style="display: none;">Save</button>
